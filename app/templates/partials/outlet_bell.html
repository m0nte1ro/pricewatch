<form action="/outlet/items/{{ item.id }}/bell" method="post" hx-post="/outlet/items/{{ item.id }}/bell" hx-swap="outerHTML"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="bell{{ ' on' if item.belled else '' }}" aria-pressed="{{ 'true' if item.belled else 'false' }}" aria-label="{{ 'Stop alerts for' if item.belled else 'Alert me about' }} {{ item.title }}" title="{{ 'Alerts on: click to stop' if item.belled else 'Alert me about price drops and stock changes' }}">{{ '🔔' if item.belled else '🔕' }}</button></form>
