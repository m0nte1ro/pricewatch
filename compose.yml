services:
  pricewatch:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      PRICEWATCH_DATA_DIR: /var/lib/pricewatch
      PRICEWATCH_SCHEDULER_ENABLED: "${PRICEWATCH_SCHEDULER_ENABLED:-true}"
      PRICEWATCH_LOG_LEVEL: "${PRICEWATCH_LOG_LEVEL:-INFO}"
    volumes:
      - ./data:/var/lib/pricewatch
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
