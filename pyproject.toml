[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pricewatch"
version = "0.1.0"
description = "A modular, self-hosted price monitor for your homelab"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2", "jinja2>=3.1,<4", "python-multipart>=0.0.20,<1",
  "httpx[http2]>=0.28,<1", "beautifulsoup4>=4.12,<5", "apscheduler>=3.10,<4",
  "pydantic-settings>=2.6,<3",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]
browser = ["playwright>=1.49,<2"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["templates/**/*.html", "static/**/*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
